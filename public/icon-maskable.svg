<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1f1a2e" />
      <stop offset="50%" stop-color="#0e0f17" />
      <stop offset="100%" stop-color="#06070a" />
    </radialGradient>

    <!-- Imperial Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae29c" />
      <stop offset="35%" stop-color="#dfaa53" />
      <stop offset="70%" stop-color="#b67f2b" />
      <stop offset="100%" stop-color="#fdf0be" />
    </linearGradient>

    <!-- Bronze Amber Inner -->
    <linearGradient id="amberGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e08a3c" />
      <stop offset="50%" stop-color="#8c4710" />
      <stop offset="100%" stop-color="#f3b865" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed Background for Maskable Icon (Safe zone inside central 80%) -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Outer Astrolabe Heaven Ring scaled within safe zone (r=180 max) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.75" />

  <!-- 8 Bagua Trigram Directions Markers -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.7">
    <!-- Qian (Heaven) - North -->
    <line x1="242" y1="96" x2="270" y2="96" />
    <line x1="242" y1="101" x2="270" y2="101" />
    <line x1="242" y1="106" x2="270" y2="106" />

    <!-- Kun (Earth) - South -->
    <line x1="242" y1="406" x2="252" y2="406" /><line x1="260" y1="406" x2="270" y2="406" />
    <line x1="242" y1="411" x2="252" y2="411" /><line x1="260" y1="411" x2="270" y2="411" />
    <line x1="242" y1="416" x2="252" y2="416" /><line x1="260" y1="416" x2="270" y2="416" />

    <!-- Li (Fire) - East -->
    <line x1="406" y1="242" x2="406" y2="270" />
    <line x1="411" y1="242" x2="411" y2="252" /><line x1="411" y1="260" x2="411" y2="270" />
    <line x1="416" y1="242" x2="416" y2="270" />

    <!-- Kan (Water) - West -->
    <line x1="96" y1="242" x2="96" y2="252" /><line x1="96" y1="260" x2="96" y2="270" />
    <line x1="101" y1="242" x2="101" y2="270" />
    <line x1="106" y1="242" x2="106" y2="252" /><line x1="106" y1="260" x2="106" y2="270" />
  </g>

  <!-- 12 Earthly Branches Dials Tick Marks -->
  <g stroke="url(#amberGrad)" stroke-width="1.8" opacity="0.6">
    <circle cx="256" cy="256" r="142" fill="none" stroke="url(#amberGrad)" stroke-width="1.5" />
    <line x1="256" y1="116" x2="256" y2="128" />
    <line x1="326" y1="135" x2="320" y2="145" />
    <line x1="377" y1="185" x2="368" y2="191" />
    <line x1="396" y1="256" x2="384" y2="256" />
    <line x1="377" y1="327" x2="368" y2="321" />
    <line x1="326" y1="377" x2="320" y2="367" />
    <line x1="256" y1="396" x2="256" y2="384" />
    <line x1="186" y1="377" x2="192" y2="367" />
    <line x1="135" y1="327" x2="144" y2="321" />
    <line x1="116" y1="256" x2="128" y2="256" />
    <line x1="135" y1="185" x2="144" y2="191" />
    <line x1="186" y1="135" x2="192" y2="145" />
  </g>

  <!-- Central Diamond Rays -->
  <polygon points="256,138 264,248 374,256 264,264 256,374 248,264 138,256 248,248" fill="url(#goldGrad)" opacity="0.22" filter="url(#glow)" />

  <!-- Yin-Yang Taiji Center Disc -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="72" fill="#0d0e14" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)" />

    <path d="M 0,-68 A 68,68 0 0,1 0,68 A 34,34 0 0,1 0,0 A 34,34 0 0,0 0,-68 Z" fill="url(#goldGrad)" />
    <path d="M 0,68 A 68,68 0 0,1 0,-68 A 34,34 0 0,1 0,0 A 34,34 0 0,0 0,68 Z" fill="#0f1018" />

    <circle cx="0" cy="-34" r="10" fill="#0f1018" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="0" cy="34" r="10" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="6" fill="#fdf0be" filter="url(#glow)" />
  </g>

  <!-- Constellation Stars -->
  <path d="M 355,155 Q 355,163 363,163 Q 355,163 355,171 Q 355,163 347,163 Q 355,163 355,155 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 157,155 Q 157,163 165,163 Q 157,163 157,171 Q 157,163 149,163 Q 157,163 157,155 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 355,347 Q 355,355 363,355 Q 355,355 355,363 Q 355,355 347,355 Q 355,355 355,347 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  <path d="M 157,347 Q 157,355 165,355 Q 157,355 157,363 Q 157,355 149,355 Q 157,355 157,347 Z" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
